name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Cancel stale PR previews on new pushes, but never cancel an in-flight production deploy.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_DIST_DIR: dist
  TYPST_VERSION: "0.15.1"
  TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"
  PYPDF_VERSION: "7.1.1"
  CF_MAX_ASSET_BYTES: "26214400"
  CF_MAX_ASSET_FILES: "20000"

jobs:
  preview:
    name: PR Build, Verify & Preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Typst binary
        id: cache_typst
        uses: actions/cache@v6
        with:
          path: ~/.local/typst-bin
          key: typst-v${{ env.TYPST_VERSION }}-${{ env.TYPST_SHA256 }}-x86_64-unknown-linux-musl

      - name: Install pinned Typst binary
        if: steps.cache_typst.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/typst-bin"
          archive="${RUNNER_TEMP}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fLsS -o "$archive" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          printf '%s  %s\n' "$TYPST_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 -C "$HOME/.local/typst-bin" "typst-x86_64-unknown-linux-musl/typst"
          rm -f "$archive"
          chmod +x "$HOME/.local/typst-bin/typst"

      - name: Add Typst to PATH
        run: |
          echo "$HOME/.local/typst-bin" >> "$GITHUB_PATH"
          "$HOME/.local/typst-bin/typst" --version

      - name: Cache upstream source tarballs
        uses: actions/cache@v6
        with:
          path: .generated/cache
          key: upstream-sources-${{ hashFiles('sources.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build site, Typst PDF book, and Pagefind index
        run: npm run build

      - name: Install pinned pypdf and verify site & PDF
        env:
          PYTHON_BIN: python
        run: |
          set -euo pipefail
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python -m pip install --quiet "pypdf==${PYPDF_VERSION}"
          npm run verify
      - name: Verify Cloudflare Static Assets limits
        run: |
          set -euo pipefail
          test -f "$SITE_DIST_DIR/index.html" || { echo "::error::Missing $SITE_DIST_DIR/index.html"; exit 1; }
          test -f "$SITE_DIST_DIR/404.html" || { echo "::error::Missing $SITE_DIST_DIR/404.html (not_found_handling is 404-page)"; exit 1; }

          file_count="$(find "$SITE_DIST_DIR" -type f | wc -l)"
          echo "Static asset files: $file_count (limit: $CF_MAX_ASSET_FILES)"
          if [ "$file_count" -gt "$CF_MAX_ASSET_FILES" ]; then
            echo "::error::Asset count ($file_count) exceeds Cloudflare Workers Free limit ($CF_MAX_ASSET_FILES)."
            exit 1
          fi

          oversized="$(find "$SITE_DIST_DIR" -type f -size +"${CF_MAX_ASSET_BYTES}"c)"
          if [ -n "$oversized" ]; then
            echo "::error::Files exceed Cloudflare's 25 MiB per-asset limit:"
            echo "$oversized"
            exit 1
          fi

      - name: Fork PR notice
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### PR Preview Skipped (Fork PR)"
            echo "Site, Typst PDF build, and verification passed. Cloudflare preview upload is skipped on fork PRs to protect credentials."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Cloudflare Workers preview version
        id: cf_preview
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"

          npx --no-install wrangler versions upload \
            --preview-alias "pr-${PR_NUMBER}" \
            --tag "pr-${PR_NUMBER}" \
            --message "PR #${PR_NUMBER} (${COMMIT_SHA:0:7})"

          alias_url="$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          version_url="$(jq -r 'select(.type == "version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          version_id="$(jq -r 'select(.type == "version-upload") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"

          if [ -z "$alias_url" ]; then
            echo "::error::Wrangler uploaded version ${version_id:-unknown} without returning preview_alias_url. Ensure Version URLs (preview_urls: true) are enabled on Worker 'titan-lang'."
            exit 1
          fi

          {
            echo "alias_url=$alias_url"
            echo "version_url=$version_url"
            echo "version_id=$version_id"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### PR Preview Uploaded"
            echo "- **Preview URL:** $alias_url"
            echo "- **Immutable Version URL:** $version_url"
            echo "- **Version ID:** \`$version_id\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR preview comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        env:
          ALIAS_URL: ${{ steps.cf_preview.outputs.alias_url }}
          VERSION_URL: ${{ steps.cf_preview.outputs.version_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const marker = "<!-- titan-lang-dev-preview -->";
            const shortSha = process.env.COMMIT_SHA.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "### Preview deployed",
              "",
              `- **Preview URL:** ${process.env.ALIAS_URL}`,
              `- **Commit snapshot:** ${process.env.VERSION_URL}`,
              `- **Commit:** \`${shortSha}\` ([workflow run](${runUrl}))`,
            ].join("\n");

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              },
            );
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  production:
    name: Production Deploy
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment:
      name: production
      url: https://titan-lang.dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cache Typst binary
        id: cache_typst
        uses: actions/cache@v6
        with:
          path: ~/.local/typst-bin
          key: typst-v${{ env.TYPST_VERSION }}-${{ env.TYPST_SHA256 }}-x86_64-unknown-linux-musl

      - name: Install pinned Typst binary
        if: steps.cache_typst.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/typst-bin"
          archive="${RUNNER_TEMP}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fLsS -o "$archive" \
            "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          printf '%s  %s\n' "$TYPST_SHA256" "$archive" | sha256sum -c -
          tar -xJf "$archive" --strip-components=1 -C "$HOME/.local/typst-bin" "typst-x86_64-unknown-linux-musl/typst"
          rm -f "$archive"
          chmod +x "$HOME/.local/typst-bin/typst"

      - name: Add Typst to PATH
        run: |
          echo "$HOME/.local/typst-bin" >> "$GITHUB_PATH"
          "$HOME/.local/typst-bin/typst" --version

      - name: Cache upstream source tarballs
        uses: actions/cache@v6
        with:
          path: .generated/cache
          key: upstream-sources-${{ hashFiles('sources.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Build site, Typst PDF book, and Pagefind index
        run: npm run build

      - name: Install pinned pypdf and verify site & PDF
        env:
          PYTHON_BIN: python
        run: |
          set -euo pipefail
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          python -m pip install --quiet "pypdf==${PYPDF_VERSION}"
          npm run verify
      - name: Verify Cloudflare Static Assets limits
        run: |
          set -euo pipefail
          test -f "$SITE_DIST_DIR/index.html" || { echo "::error::Missing $SITE_DIST_DIR/index.html"; exit 1; }
          test -f "$SITE_DIST_DIR/404.html" || { echo "::error::Missing $SITE_DIST_DIR/404.html (not_found_handling is 404-page)"; exit 1; }

          file_count="$(find "$SITE_DIST_DIR" -type f | wc -l)"
          echo "Static asset files: $file_count (limit: $CF_MAX_ASSET_FILES)"
          if [ "$file_count" -gt "$CF_MAX_ASSET_FILES" ]; then
            echo "::error::Asset count ($file_count) exceeds Cloudflare Workers Free limit ($CF_MAX_ASSET_FILES)."
            exit 1
          fi

          oversized="$(find "$SITE_DIST_DIR" -type f -size +"${CF_MAX_ASSET_BYTES}"c)"
          if [ -n "$oversized" ]; then
            echo "::error::Files exceed Cloudflare's 25 MiB per-asset limit:"
            echo "$oversized"
            exit 1
          fi

      - name: Deploy to Cloudflare Workers (titan-lang)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-deploy.ndjson
        run: |
          set -euo pipefail
          rm -f "$WRANGLER_OUTPUT_FILE_PATH"

          npx --no-install wrangler deploy \
            --message "Deploy ${GITHUB_SHA:0:7}"

          version_id="$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          {
            echo "### Production Deployed"
            echo "- **Site:** https://titan-lang.dev"
            echo "- **Worker:** \`titan-lang\`"
            echo "- **Version ID:** \`${version_id:-unknown}\`"
            echo "- **Commit:** \`${GITHUB_SHA:0:7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
